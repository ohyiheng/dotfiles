plugins: fetchart scrub replaygain lastgenre inline lyrics unimported importreplace edit filetote musicbrainz fromfilename
directory: /data/media/audio/music
library: ~/.config/beets/library.db
threaded: yes
original_date: no
per_disc_numbering: yes

# convert:
#     auto: no
#     ffmpeg: /usr/bin/ffmpeg
#     opts: -ab 320k -ac 2 -ar 48000
#     max_bitrate: 320
#     threads: 1

item_fields:
  disc_and_track: u'%i-%02i.' % (disc, track) if disctotal > 1 else u'%02i.' % (track)

paths:
  default: %first{$albumartist}/$album%aunique{}/$disc_and_track %first{$artist} - $title
  # singleton: Non-Album/$artist - $title
  # comp: Compilations/$album%aunique{}/$track - $title
  # albumtype_soundtrack: Soundtracks/$album/$track $title

import:
  write: yes
  copy: no
  move: yes
  resume: ask
  incremental: no
  quiet_fallback: asis
  timid: no
  group_albums: yes
  log: ~/.config/beets/beet.log

importreplace:
  replacements:
    - item_fields: artist albumartist
      album_fields: albumartist artist
      replace:
        ',': ';'
    - item_fields: title artist artist_sort artist_credit
      album_fields: album artist artist_sort artist_credit
      replace:
        '[\u2018-\u201B]': ''''
        '[\u201C-\u201F]': '"'
        '[\u2010-\u2015]': '-'

unimported:
  ignore_extensions: jpg png jpeg nfo lrc cue m3u m3u8 url sfv log pdf ini txt aup3
  ignore_subdirectories: _weekly .thumbnails

lastgenre:
  auto: yes
  source: album

# embedart:
#     auto: yes

fetchart:
  auto: yes

lyrics:
  auto: no
  synced: yes
  sources: [lrclib]

replaygain:
  auto: yes
  backend: ffmpeg

scrub:
  auto: yes

deezer:
  source_weight: 0.5
musicbrainz:
  genre: yes
  
filetote:
  extensions: .jpg .cue .png

